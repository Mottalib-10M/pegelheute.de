name: PEGELONLINE snapshot update and deploy

# Chaque jour vers 5 h 20 (heure de Berlin en hiver) : scripts/fetch-pegel.mjs relit PEGELONLINE (WSV,
# DL-DE->Zero-2.0) et réécrit src/data/pegel.json et mini.json : premier rendu, tendance sur 24 h, plage des
# 30 derniers jours citée dans le texte des pages de station, llms.txt. Le navigateur relit ensuite les niveaux
# lui-même (src/lib/live.ts) ; la relecture quotidienne garde le texte statique au même jour.
# Ce workflow est le seul qui publie le site : push sur main, tâche planifiée et lancement manuel.
# Modèle : canadaprocessingtimes.com/.github/workflows/update-data.yml (RECETTE, sites à données datées).
on:
  schedule:
    - cron: "20 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Read PEGELONLINE (scheduled and manual runs)
        if: github.event_name != 'push'
        run: npm run update-data

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Commit the new readings
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pegel.json src/data/mini.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else
            git commit -m "Momentaufnahme PEGELONLINE vom $(date -u +%F)" && git push && echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (script IndexNow)
        if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
        uses: actions/checkout@v4
      - name: Ping IndexNow
        if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
        continue-on-error: true
        run: bash scripts/indexnow.sh https://pegelheute.de
